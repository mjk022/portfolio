    <div class="container">
        
    
    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://i.ibb.co/TRy5J7h/wallpaperbetter-1.jpg" style="width: 115%; height: 90%; margin: 20px" class="d-block w-30" alt="..." />
            </div>
            <div class="carousel-item">
                <img src="https://i.ibb.co/RBxjvvt/2.jpg" style="max-width: 100%; height: auto; display: block; margin: 0 auto" class="d-block w-30" alt="..." />
            </div>
            <div class="carousel-item">
                <img src="https://i.ibb.co/72HGcbh/1.png" style="display: block; margin: 0 auto" class="d-block w-30" alt="..." />
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon text-dark" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <div>
        <h4>부자로 가는 길</h4>
        <p>전국 부동산 아파트 매매가격 지수 예측
            향후 6개월 부동산 아파트 매매가격 지수 예측합니다. 
            가장 최적의 시기에 매매하여 부자가 되세요</p>
    </div>

    <form id="predict-form" onsubmit="event.preventDefault();runPredict();">
        <input type="text" placeholder="금리" id="first">
        <input type="text" placeholder="국내 총생산" id="second">
        <input type="text" placeholder="대출 금리" id="third">
        <input type="text" placeholder="매매 거래량" id="fourth">
        <input type="submit" value="predict">
        <br><br>
        <div>
            <h4>입력 값: </h4>
            <h6>금리 : <span id="o1"></span></h6>
            <h6>국내 총생산 : <span id="o2"></span></h6>
            <h6>대출 금리 : <span id="o3"></span></h6>
            <h6>매매 거래량 : <span id="o4"></span></h6>
            <h5>예측 값 : <span id="pred"></span></h5>
        </div>
    </form>
    <script src="tree.js"></script>
    <script>
    function runPredict(){
      const ids=["first","second","third","fourth"];
      const x=ids.map(i=>parseFloat(document.getElementById(i).value.replace(/,/g,"")));
      ids.forEach((i,k)=>document.getElementById("o"+(k+1)).textContent=document.getElementById(i).value);
      document.getElementById("pred").textContent=x.some(isNaN)?"숫자를 입력해 주세요":predictTree(x).toFixed(4);
    }
    </script>

    <br><br><br>

    </div>
